<title>SuomiSimulaattori — Julkisen talouden malli 2019–2050</title>
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --text: #0f172a;
  --muted: #475569;
  --border: #e2e8f0;
  --green: #16a34a;
  --red: #dc2626;
  --blue: #2563eb;
  --purple: #6d28d9;
  --amber: #d97706;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
#no-js-banner {
  background: #fef3c7; color: #92400e; border-bottom: 2px solid #f59e0b;
  padding: 12px 16px; font-size: 0.95rem; font-weight: 600;
}
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 340px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  padding: 16px; overflow-y: auto; max-height: 100vh; position: sticky; top: 0;
}
.main { flex: 1; min-width: 0; padding: 18px 22px 44px; max-width: 1360px; margin: 0 auto; }
.mobile-ctrl-toggle { display: none; width: 100%; padding: 11px 14px; font-size: 0.96rem; font-weight: 600; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); cursor: pointer; margin-bottom: 12px; text-align: left; }
h1 { font-size: 1.55rem; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 1.12rem; margin: 16px 0 8px; }
h3 { font-size: 0.98rem; margin: 14px 0 6px; color: var(--text); }
.subtitle { font-size: 0.86rem; color: var(--muted); margin-bottom: 14px; }
.ctrl-group { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.ctrl-label { display: flex; justify-content: space-between; gap: 8px; font-size: 0.84rem; font-weight: 500; margin-bottom: 4px; }
.ctrl-val { font-weight: 700; color: var(--blue); white-space: nowrap; }
input[type="range"] { width: 100%; accent-color: var(--blue); height: 22px; margin: 0 0 8px; cursor: pointer; }
select, button.btn {
  width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 0.9rem;
}
button.btn { cursor: pointer; font-weight: 600; background: var(--surface-2); }
button.btn:hover { background: #e2e8f0; }
.radio-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.radio-pill {
  flex: 1; text-align: center; padding: 7px 8px; font-size: 0.82rem; font-weight: 600;
  border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--surface-2); user-select: none;
}
.radio-pill.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; margin: 6px 0; cursor: pointer; }
.caption { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
.verdict {
  padding: 14px 16px; border-radius: 10px; border-left: 6px solid; margin-bottom: 14px;
}
.verdict.kestava { background: rgba(22,163,74,0.11); border-left-color: var(--green); }
.verdict.naivettyminen { background: rgba(217,119,6,0.13); border-left-color: var(--amber); }
.verdict.velkakriisi { background: rgba(220,38,38,0.13); border-left-color: var(--red); }
.verdict-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
.verdict-meta { font-size: 0.83rem; margin-top: 8px; color: var(--text); opacity: 0.9; }
.kpi-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.kpi-head { font-size: 0.86rem; font-weight: 700; margin-bottom: 8px; color: var(--text); }
.kpi-items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi-label { font-size: 0.75rem; color: var(--muted); }
.kpi-num { font-size: 1.05rem; font-weight: 700; }
.kpi-delta { font-size: 0.75rem; font-weight: 600; }
.pos { color: var(--green); }
.neg { color: var(--red); }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
.tab-btn {
  padding: 8px 12px; border: 1px solid transparent; border-radius: 8px 8px 0 0; background: transparent;
  font-size: 0.88rem; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap;
}
.tab-btn.active { background: var(--surface); color: var(--blue); border-color: var(--border); border-bottom-color: var(--surface); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.chart-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px;
}
.chart-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.chart-title { font-size: 0.96rem; font-weight: 700; }
.chart-readout { font-size: 0.8rem; color: var(--text); background: var(--surface-2); padding: 4px 8px; border-radius: 6px; min-height: 24px; }
.svg-wrap { width: 100%; touch-action: pan-y; position: relative; }
.svg-wrap svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 8px; font-size: 0.78rem; color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.table-wrap { max-height: 380px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
thead th { position: sticky; top: 0; background: var(--surface-2); font-weight: 700; z-index: 1; }
.meth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; font-size: 0.9rem; }
@media (max-width: 960px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; max-height: none; position: static; border-right: none; border-bottom: 1px solid var(--border); display: none; }
  .sidebar.open { display: block; }
  .mobile-ctrl-toggle { display: block; }
  .main { padding: 12px 12px 32px; }
  h1 { font-size: 1.25rem; }
  .kpi-grid, .grid-2 { grid-template-columns: 1fr; }
}
</style>
</head>

(function (root) {
  function normalizedMigrationShares(inputs) {
    const w = Math.max(0.0, Number(inputs.work_imm_share_pct) || 0);
    const h = Math.max(0.0, Number(inputs.humanitarian_imm_share_pct) || 0);
    const s = Math.max(0.0, Number(inputs.student_imm_share_pct) || 0);
    const tot = w + h + s;
    if (tot <= 0) return [0.5, 0.35, 0.15];
    return [w / tot, h / tot, s / tot];

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeGaussianRng(seed) {
    const u = mulberry32(seed);
    let spare = null;
    return function randn() {
      if (spare !== null) {
        const val = spare;
        spare = null;
        return val;
      }
      let u1 = 0;
      while (u1 <= 1e-12) u1 = u();
      const u2 = u();
      const mag = Math.sqrt(-2.0 * Math.log(u1));
      spare = mag * Math.sin(2.0 * Math.PI * u2);
      return mag * Math.cos(2.0 * Math.PI * u2);
    };
  }

  function generateAr1Shocks(randn, nSim, nSteps, phi, sigma) {
    const nTotal = nSim + 1;
    const out = new Float64Array(nTotal * nSteps);
    if (nSim <= 0 || sigma <= 0) return out;
    const innovStd = sigma * Math.sqrt(Math.max(1e-9, 1.0 - phi * phi));
    for (let i = 1; i < nTotal; i++) {
      let state = randn() * sigma * 0.5;
      for (let t = 0; t < nSteps; t++) {
        state = phi * state + randn() * innovStd;
        out[i * nSteps + t] = state;
      }
    }
    return out;
  }

  function percentileLinear(arr, q) {
    const sorted = Array.from(arr).sort((a, b) => a - b);
    const n = sorted.length;
    if (n === 0) return 0;
    if (n === 1) return sorted[0];
    const pos = (q / 100.0) * (n - 1);
    const lo = Math.floor(pos);
    const hi = Math.ceil(pos);
    const frac = pos - lo;
    return sorted[lo] * (1.0 - frac) + sorted[hi] * frac;
  }

  function interpolateAnnualToMonthlyFlow(annualValsBn, seasonalWeights) {
    const nYears = annualValsBn.length;
    const out = new Float64Array(nYears * 12);
    let weights = new Array(12).fill(1.0);
    if (seasonalWeights && seasonalWeights.length === 12) {
      const meanW = seasonalWeights.reduce((a, b) => a + b, 0) / 12.0;
      weights = seasonalWeights.map((v) => v / meanW);
    }
    for (let idx = 0; idx < nYears; idx++) {
      const yCurr = Number(annualValsBn[idx]) * 1000.0;
      const yPrev = idx > 0 ? Number(annualValsBn[idx - 1]) * 1000.0 : yCurr;
      const yNext = idx < nYears - 1 ? Number(annualValsBn[idx + 1]) * 1000.0 : yCurr;
      const slope = 0.5 * (yNext - yPrev);
      const raw12 = new Float64Array(12);

        const val = trend * weights[m];

        rawSum += val;

      }
    }
    return out;
  }

  function interpolateAnnualToMonthlyStock(annualVals) {
    const nYears = annualVals.length;
    const out = new Float64Array(nYears * 12);
    for (let idx = 0; idx < nYears; idx++) {
      const endVal = Number(annualVals[idx]);
      const startVal = idx > 0 ? Number(annualVals[idx - 1]) : endVal;
      for (let m = 0; m < 12; m++) {

    const expSote = interpolateAnnualToMonthlyFlow(col("exp_sote_edu_bn"), expW);
    const expNatSoc = interpolateAnnualToMonthlyFlow(col("exp_native_social_bn"), expW);
    const expImmSoc = interpolateAnnualToMonthlyFlow(col("exp_immigrant_social_bn"), expW);
    const expFixed = interpolateAnnualToMonthlyFlow(col("exp_fixed_other_bn"), expW);
    const expInt = interpolateAnnualToMonthlyFlow(col("exp_interest_bn"), null);

    const revWage = interpolateAnnualToMonthlyFlow(col("rev_wage_pension_taxes_bn"), revW);
    const revCons = interpolateAnnualToMonthlyFlow(col("rev_consumption_taxes_bn"), revW);
    const revClaw = interpolateAnnualToMonthlyFlow(col("rev_social_clawback_bn"), expW);
    const revCorp = interpolateAnnualToMonthlyFlow(col("rev_corp_capital_property_bn"), revW);

    const rows = [];
    for (let i = 0; i < annualRows.length; i++) {
      const yr = annualRows[i].year;
      for (let m = 0; m < 12; m++) {
        const idx = i * 12 + m;
        const delta = (revSeas[idx] - revFlat[idx]) - (expSeas[idx] - expFlat[idx]);
        const b50 = balBase50[idx] + delta;
        const b05 = Math.min(b50, balBase05[idx] + delta);
        const b95 = Math.max(b50, balBase95[idx] + delta);
        const mm = String(m + 1).padStart(2, "0");
        rows.push({
          ym: yr + "-" + mm,
          date: yr + "-" + mm + "-01",
          year: yr,
          month: m + 1,
          is_historical: yr <= 2025,
          revenue_p50_meur: revSeas[idx],
          revenue_p05_meur: revP05[idx],
          revenue_p95_meur: revP95[idx],
          expenditure_p50_meur: expSeas[idx],
          expenditure_p05_meur: expP05[idx],
          expenditure_p95_meur: expP95[idx],
          net_lending_p50_meur: b50,
          net_lending_p05_meur: b05,
          net_lending_p95_meur: b95,
          debt_p50_bn: debtP50[idx],
          debt_gdp_p50: dgdpP50[idx],
          debt_gdp_p05: dgdpP05[idx],
          debt_gdp_p95: dgdpP95[idx],
          exp_pensions_meur: expPen[idx],
          exp_sote_edu_meur: expSote[idx],
          exp_native_social_meur: expNatSoc[idx],
          exp_immigrant_social_meur: expImmSoc[idx],
          exp_fixed_other_meur: expFixed[idx],
          exp_interest_meur: expInt[idx],
          rev_wage_pension_taxes_meur: revWage[idx],
          rev_consumption_taxes_meur: revCons[idx],
          rev_social_clawback_meur: revClaw[idx],
          rev_corp_capital_property_meur: revCorp[idx],
        });
      }
    }
    return rows;
  }

  function evaluateVerdictJS(annualRows, crisisEverProbPct, crisisProbByYear, mcDebtGdpLastCol, forecastYears) {
    const byYear = (yr) => annualRows.find((r) => r.year === yr);
    const r2025 = byYear(2025);
    const r2035 = byYear(2035);
    const r2040 = byYear(2040);
    const r2050 = byYear(2050);
    const fc = annualRows.filter((r) => r.year >= 2026);

    let peakDebtGdp = -Infinity;
    let peakDebtYear = 2026;
    for (const r of fc) {
      if (r.debt_gdp_p50 > peakDebtGdp) {
        peakDebtGdp = r.debt_gdp_p50;
        peakDebtYear = r.year;
      }
    }

    const debt2025 = r2025.debt_gdp_p50;
    const debt2035 = r2035.debt_gdp_p50;
    const debt2040 = r2040.debt_gdp_p50;
    const debt2050 = r2050.debt_gdp_p50;
    const balGdp2050 = r2050.net_lending_gdp_p50;
    const intRev2050 = r2050.interest_to_rev_p50;

    const crisisRow = fc.find((r) => r.is_crisis_p50);
    const medianCrisisYear = crisisRow ? crisisRow.year : null;
    const idx50 = crisisProbByYear.findIndex((p) => p >= 50.0);
    const mcCrisisYear = idx50 >= 0 ? forecastYears[idx50] : null;
    const estCrisisYear = medianCrisisYear || mcCrisisYear;

    const risk90Row = fc.find((r) => r.debt_gdp_p50 > 90.0);
    const risk90Year = risk90Row ? risk90Row.year : null;

    const debtTurningDown = (debt2050 < peakDebtGdp - 2.0 && debt2050 < debt2040) || (debt2050 < debt2025 - 2.0);

    let statusCode, title, summary;
    if (medianCrisisYear !== null || crisisEverProbPct >= 50.0 || debt2050 >= 120.0 || intRev2050 >= 15.0) {
      statusCode = "velkakriisi";
      title = "AKUUTTI VELKAKRIISI — Julkinen talous ajautuu maksukyvyttömyysuralle";
      summary =
        "Valitussa skenaariossa velkasuhde nousee vuoden 2025 tasolta (" + debt2025.toFixed(1) + " %) " +
        "vuoteen 2050 mennessä mediaanitasolle " + debt2050.toFixed(1) + " % BKT:sta ja korkomenot " +
        "vievät " + intRev2050.toFixed(1) + " % tuloista. " +
        (estCrisisYear ? "Kriisiraja (120 % velka/BKT tai 15 % korkomenot tuloista) ylittyy arviolta vuonna " + estCrisisYear + ". " : "") +
        "Monte Carlo -simulaatioissa kriisirajan ylittymisen todennäköisyys on " + crisisEverProbPct.toFixed(1) + " %.";
    } else if (debtTurningDown && balGdp2050 >= -1.2 && debt2050 < 98.0 && crisisEverProbPct < 15.0) {
      statusCode = "kestava";
      title = "KESTÄVÄ TALOUSKASVU — Velkasuhde taittuu ja rahoitusasema vahvistuu";
      summary =
        "Talouskasvu, työllisyyskehitys ja rakenteelliset toimet vakauttavat julkisen talouden. " +
        "Velkasuhde saavuttaa huippunsa (" + peakDebtGdp.toFixed(1) + " %) vuonna " + peakDebtYear +
        " ja laskee vuoteen 2050 mennessä tasolle " + debt2050.toFixed(1) + " % BKT:sta " +
        "(rahoitusjäämä " + (balGdp2050 >= 0 ? "+" : "") + balGdp2050.toFixed(1) + " % BKT:sta). " +
        "Velkakriisin todennäköisyys on alhainen (" + crisisEverProbPct.toFixed(1) + " %).";
    } else {
      statusCode = "naivettyminen";
      title = "HIDAS NÄIVETTYMINEN JA KOHONNUT VELKARISKI — Rakenteellinen alijäämä jatkuu";
      summary =
        "Julkinen talous ei räjähdä välittömään velkakriisiin mediaanipolulla, mutta " +
        "rakenteellinen alijäämä ja ikääntymismenot pitävät velkasuhteen nousussa (" +
        debt2025.toFixed(1) + " % vuonna 2025 → " + debt2035.toFixed(1) + " % vuonna 2035 → " +
        debt2050.toFixed(1) + " % vuonna 2050). Monte Carlo -simulaatioissa akuutin velkakriisin " +
        "todennäköisyys vuoteen 2050 mennessä on " + crisisEverProbPct.toFixed(1) + " %.";
    }

    let lowerCount = 0;
    for (let i = 0; i < mcDebtGdpLastCol.length; i++) {
      if (mcDebtGdpLastCol[i] < debt2025) lowerCount++;
    }
    const probDebtLower2050 = (100.0 * lowerCount) / Math.max(1, mcDebtGdpLastCol.length);

    return {
      status_code: statusCode,
      title: title,
      summary: summary,
      crisis_ever_prob_pct: Math.round(crisisEverProbPct * 10) / 10,
      est_crisis_year: estCrisisYear,
      risk90_year: risk90Year,
      peak_debt_gdp: Math.round(peakDebtGdp * 10) / 10,
      peak_debt_year: peakDebtYear,
      prob_debt_lower_2050_pct: Math.round(probDebtLower2050 * 10) / 10,
    };
  }

  function runSimulationJS(cfg, userInputs, nSimOverride) {
    const t0 = performance.now();
    const params = cfg.params;
    const hist = cfg.hist.slice().sort((a, b) => a.year - b.year);
    const r2025 = hist.find((r) => r.year === 2025);
    const forecastYears = cfg.forecastYears;
    const nSteps = forecastYears.length;
    const nSim = nSimOverride !== undefined ? nSimOverride : params.n_simulations;
    const nTotal = nSim + 1;

    const randn = makeGaussianRng(params.random_seed);
    const shocksProd = generateAr1Shocks(randn, nSim, nSteps, params.mc_productivity_phi, params.mc_productivity_sigma);
    const shocksEmp = generateAr1Shocks(randn, nSim, nSteps, params.mc_employment_phi, params.mc_employment_sigma);
    const shocksRate = generateAr1Shocks(randn, nSim, nSteps, params.mc_interest_phi, params.mc_interest_sigma);
    const shocksMig = generateAr1Shocks(randn, nSim, nSteps, params.mc_migration_phi, params.mc_migration_sigma);

    const pop017_25 = Number(r2025.pop_0_17);
    const popNat1864_25 = Number(r2025.pop_finnish_bg_18_64);
    const popFor1864_25 = Number(r2025.pop_foreign_bg_18_64);
    const pop6574_25 = Number(r2025.pop_65_74);
    const pop75p_25 = Number(r2025.pop_75_plus);

    const sub = cfg.subgroups2025;
    const subSum = sub.work_immigrants + sub.humanitarian_immigrants + sub.student_immigrants;
    const immScale = popFor1864_25 / subSum;
    const baseWorkImm = sub.work_immigrants * immScale;
    const baseHumImm = sub.humanitarian_immigrants * immScale;
    const baseStudImm = sub.student_immigrants * immScale;

    const humCurve = cfg.humCurve;
    const humShareRaw = cfg.humTenureShares;
    const humShareSum = humShareRaw.reduce((a, b) => a + b, 0);
    const humShares = humShareRaw.map((v) => v / humShareSum);

    const baseEmpNat = popNat1864_25 * params.native_base_employment_rate;
    const baseEmpWork = baseWorkImm * params.work_imm_employment_rate;
    const baseHumBuckets = humShares.map((s) => baseHumImm * s);
    let baseEmpHum = 0;
    for (let k = 0; k < 11; k++) baseEmpHum += baseHumBuckets[k] * humCurve[k];
    const baseEmpStud = baseStudImm * params.student_employment_rate;
    const baseEmp6574 = pop6574_25 * params.elderly_65_74_employment_rate;

    const baseWageBillBn = (
      baseEmpNat * params.native_avg_wage_eur +
      baseEmpWork * params.work_imm_avg_wage_eur +
      baseEmpHum * params.humanitarian_avg_wage_eur +
      baseEmpStud * params.student_avg_wage_eur +
      baseEmp6574 * params.elderly_65_74_avg_wage_eur
    ) / 1e9;

    const basePensions25Bn = (pop6574_25 + pop75p_25) * params.pension_cost_per_65_plus_eur / 1e9;
    const baseSote25Bn = (
      pop017_25 * params.sote_edu_cost_0_17_eur +
      (popNat1864_25 + popFor1864_25) * params.sote_edu_cost_18_64_eur +
      pop6574_25 * params.sote_edu_cost_65_74_eur +
      pop75p_25 * params.sote_edu_cost_75_plus_eur
    ) / 1e9;
    const baseNatSoc25Bn = (popNat1864_25 - baseEmpNat) * params.native_social_cost_per_non_emp_eur / 1e9;
    const baseImmSoc25Bn = (
      (baseWorkImm - baseEmpWork) * params.work_imm_social_cost_per_non_emp_eur +
      (baseHumImm - baseEmpHum) * params.humanitarian_social_cost_per_non_emp_eur +
      (baseHumBuckets[0] + baseHumBuckets[1] + baseHumBuckets[2]) * params.humanitarian_integration_cost_per_recent_eur +
      (baseStudImm - baseEmpStud) * params.student_social_cost_per_non_emp_eur
    ) / 1e9;

    const hist25RevBn = Number(r2025.total_revenue_bn);
    const hist25ExpBn = Number(r2025.total_expenditure_bn);
    const hist25GdpBn = Number(r2025.nominal_gdp_bn);
    const hist25DebtBn = Number(r2025.edp_debt_bn);
    const hist25IntBn = Number(r2025.exp_interest_bn);

    const modelRev25Raw =
      baseWageBillBn * params.effective_wage_tax_soc_rate +
      basePensions25Bn * params.pension_income_tax_rate +
      baseWageBillBn * params.net_disposable_wage_share * params.consumption_tax_rate +
      params.autonomous_indirect_tax_gdp_share * hist25GdpBn +
      params.social_clawback_rate * (basePensions25Bn + baseNatSoc25Bn + baseImmSoc25Bn) +
      params.corp_capital_property_gdp_share * hist25GdpBn;
    const revCalibAnchor = hist25RevBn / Math.max(1e-6, modelRev25Raw);

    const fixed25AnchorBn = Math.max(
      10.0,
      hist25ExpBn - (basePensions25Bn + baseSote25Bn + baseNatSoc25Bn + baseImmSoc25Bn + hist25IntBn)
    );

    const yProfSum = cfg.youthProfile.reduce((a, b) => a + b, 0);
    const yProf = cfg.youthProfile.map((v) => (v * pop017_25) / yProfSum);
    const youthCohorts = new Float64Array(nTotal * 18);
    const humBuckets = new Float64Array(nTotal * 11);
    for (let i = 0; i < nTotal; i++) {
      for (let a = 0; a < 18; a++) youthCohorts[i * 18 + a] = yProf[a];
      for (let k = 0; k < 11; k++) humBuckets[i * 11 + k] = baseHumBuckets[k];
    }

    const popNat1864 = new Float64Array(nTotal).fill(popNat1864_25);
    const popWorkImm = new Float64Array(nTotal).fill(baseWorkImm);
    const popGradImm = new Float64Array(nTotal).fill(0.0);
    const popStudImm = new Float64Array(nTotal).fill(baseStudImm);
    const pop6574 = new Float64Array(nTotal).fill(pop6574_25);
    const pop75p = new Float64Array(nTotal).fill(pop75p_25);

    const debtBn = new Float64Array(nTotal).fill(hist25DebtBn);
    const effDebtRate = new Float64Array(nTotal).fill(hist25IntBn / Math.max(1.0, hist25DebtBn));
    const prevIntToRev = new Float64Array(nTotal).fill(hist25IntBn / Math.max(1.0, hist25RevBn));

    const cumProd = new Float64Array(nTotal).fill(1.0);
    const cumSoc = new Float64Array(nTotal).fill(1.0);
    const cumTyel = new Float64Array(nTotal).fill(1.0);
    const cumSote = new Float64Array(nTotal).fill(1.0);
    const cumFixed = new Float64Array(nTotal).fill(1.0);
    const cumAsset = new Float64Array(nTotal).fill(1.0);

    const matRev = new Float64Array(nTotal * nSteps);
    const matExp = new Float64Array(nTotal * nSteps);
    const matBal = new Float64Array(nTotal * nSteps);
    const matDebt = new Float64Array(nTotal * nSteps);
    const matGdp = new Float64Array(nTotal * nSteps);
    const matDebtGdp = new Float64Array(nTotal * nSteps);
    const matBalGdp = new Float64Array(nTotal * nSteps);
    const matIntRev = new Float64Array(nTotal * nSteps);
    const matEffRate = new Float64Array(nTotal * nSteps);
    const matEconDep = new Float64Array(nTotal * nSteps);
    const matCrisis = new Uint8Array(nTotal * nSteps);

    const matRevComp = new Float64Array(4 * nTotal * nSteps);
    const matExpComp = new Float64Array(6 * nTotal * nSteps);

    const detComp = {
      pop_total: new Float64Array(nSteps),
      pop_0_17: new Float64Array(nSteps),
      pop_18_64: new Float64Array(nSteps),
      pop_65_74: new Float64Array(nSteps),
      pop_75_plus: new Float64Array(nSteps),
      employed_total: new Float64Array(nSteps),
      non_employed_18_64: new Float64Array(nSteps),
      demo_dependency_ratio: new Float64Array(nSteps),
      econ_dependency_ratio: new Float64Array(nSteps),
      eff_debt_rate_pct: new Float64Array(nSteps),
      marginal_rate_pct: new Float64Array(nSteps),
      risk_premium_pct: new Float64Array(nSteps),
    };

    const immRecords = [];
    const popForEldShare = baseWorkImm / Math.max(1.0, baseWorkImm + baseHumImm);
    const popFor6574_25 = Number(r2025.pop_foreign_bg_65_74 || 0);
    const popFor75p_25 = Number(r2025.pop_foreign_bg_75_plus || 0);
    let retWork6574 = popFor6574_25 * popForEldShare;
    let retWork75p = popFor75p_25 * popForEldShare;
    let retHum6574 = popFor6574_25 * (1.0 - popForEldShare);
    let retHum75p = popFor75p_25 * (1.0 - popForEldShare);
    let retStud6574 = 0.0;
    let retStud75p = 0.0;
    const fixedMarginalPerCapEur = 0.30 * ((fixed25AnchorBn * 1e9) / Number(r2025.pop_total));

    const [wShare, hShare, sShare] = normalizedMigrationShares(userInputs);
    const studStayRate = Math.min(0.95, Math.max(0.05, Number(userInputs.student_stay_rate_pct) / 100.0));
    const clip = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

    for (let t = 0; t < nSteps; t++) {
      const year = forecastYears[t];
      const fracT = (t + 1) / nSteps;
      const policyPhase = Math.min(1.0, (t + 1) / 4.0);
      const effTaxChangePp = policyPhase * Number(userInputs.tax_rate_change_pp);
      const effBenChangePct = policyPhase * Number(userInputs.social_benefit_change_pct);
      const effFixedChangePct = policyPhase * Number(userInputs.fixed_exp_adjustment_pct);
      const laborSupplyDelta = (effTaxChangePp * params.tax_emp_elasticity + effBenChangePct * params.benefit_emp_elasticity) / 100.0;
      const adjDisposableShare = clip(params.net_disposable_wage_share - 0.55 * (effTaxChangePp / 100.0), 0.50, 0.85);
      const expImpulseShare =
        (effFixedChangePct / 100.0) * (fixed25AnchorBn / hist25GdpBn) +
        (effBenChangePct / 100.0) * ((baseNatSoc25Bn + baseImmSoc25Bn) / hist25GdpBn);
      const demandDecay = t < 6 ? Math.exp(-t / 4.0) : 0.0;
      const demandShock = clip(1.0 + params.fiscal_multiplier_short * expImpulseShare * demandDecay, 0.85, 1.15);
      const soteTrendWeight = t < 10 ? 1.0 : Math.max(0.25, Math.exp(-(t - 9) / 10.0));

      const benefitMult = Math.max(0.5, 1.0 + effBenChangePct / 100.0);
      const fixedMult = Math.max(0.5, 1.0 + effFixedChangePct / 100.0);
      const mort75p = params.mortality_rate_75_plus_2025 + (params.mortality_rate_75_plus_2050 - params.mortality_rate_75_plus_2025) * fracT;
      const survImprovement = (params.mortality_rate_75_plus_2025 - mort75p) / params.mortality_rate_75_plus_2025;
      const longevityBrake = 1.0 - 0.45 * Math.max(0.0, survImprovement);

      const humScaled = humCurve.map((c) => clip(c * Number(userInputs.humanitarian_integration_speed), 0.05, 0.84));
      const rolloverAlpha = 1.0 / params.debt_rollover_years;

      for (let i = 0; i < nTotal; i++) {
        const yOff = i * 18;
        const hOff = i * 11;
        const sIdx = i * nSteps + t;

        let pHumTot = 0;
        for (let k = 0; k < 11; k++) pHumTot += humBuckets[hOff + k];
        const p1864Pre = popNat1864[i] + popWorkImm[i] + popGradImm[i] + pHumTot + popStudImm[i];
        const births = p1864Pre * (0.258 / 25.0) * Number(userInputs.total_fertility_rate);

        const turn18 = youthCohorts[yOff + 17] * (1.0 - params.mortality_rate_0_17);
        for (let a = 17; a >= 1; a--) {
          youthCohorts[yOff + a] = youthCohorts[yOff + a - 1] * (1.0 - params.mortality_rate_0_17);
        }
        youthCohorts[yOff] = births;

        const retNat = popNat1864[i] / 44.5;
        const retWork = popWorkImm[i] / 36.0;
        const retGrad = popGradImm[i] / 36.0;
        const mortNat = popNat1864[i] * params.mortality_rate_18_64;
        const mortWork = popWorkImm[i] * params.mortality_rate_18_64;
        const mortGrad = popGradImm[i] * params.mortality_rate_18_64;

        const netMig = Math.max(0.0, Number(userInputs.annual_net_immigration) + shocksMig[sIdx]);
        const inWork = netMig * wShare;
        const inHum = netMig * hShare;
        const inStud = netMig * sShare;

        const gradStud = popStudImm[i] / params.avg_study_duration_years;
        const stayGrad = gradStud * studStayRate;

        popNat1864[i] = Math.max(100000.0, popNat1864[i] + turn18 - retNat - mortNat);
        popWorkImm[i] = Math.max(0.0, popWorkImm[i] + inWork - retWork - mortWork);
        popGradImm[i] = Math.max(0.0, popGradImm[i] + stayGrad - retGrad - mortGrad);
        popStudImm[i] = Math.max(0.0, popStudImm[i] + inStud - gradStud);

        let retHumSum = 0;
        const survHum = new Float64Array(11);
        for (let k = 0; k < 11; k++) {
          const hk = humBuckets[hOff + k];
          const rk = hk / 38.0;
          const mk = hk * params.mortality_rate_18_64;
          retHumSum += rk;
          survHum[k] = Math.max(0.0, hk - rk - mk);
        }
        for (let k = 1; k < 10; k++) humBuckets[hOff + k] = survHum[k - 1];
        humBuckets[hOff + 10] = survHum[9] + survHum[10];
        humBuckets[hOff] = inHum;

        pHumTot = 0;
        for (let k = 0; k < 11; k++) pHumTot += humBuckets[hOff + k];

        const totRet65 = retNat + retWork + retGrad + retHumSum;
        const ag75 = pop6574[i] * 0.100;
        const m6574 = pop6574[i] * params.mortality_rate_65_74;
        pop6574[i] = Math.max(100000.0, pop6574[i] + totRet65 - ag75 - m6574);
        pop75p[i] = Math.max(100000.0, pop75p[i] + ag75 - pop75p[i] * mort75p);

        let p017 = 0;
        for (let a = 0; a < 18; a++) p017 += youthCohorts[yOff + a];
        const p1864 = popNat1864[i] + popWorkImm[i] + popGradImm[i] + pHumTot + popStudImm[i];
        const p65p = pop6574[i] + pop75p[i];
        const pTot = p017 + p1864 + p65p;

        const se = shocksEmp[sIdx];
        const erNat = clip(params.native_base_employment_rate + policyPhase * (Number(userInputs.native_emp_change_pp) / 100.0) + laborSupplyDelta + se, 0.45, 0.88);
        const erWork = clip(params.work_imm_employment_rate + 0.7 * laborSupplyDelta + 0.70 * se, 0.50, 0.92);
        const erGrad = clip(params.grad_student_employment_rate + 0.7 * laborSupplyDelta + 0.70 * se, 0.50, 0.92);
        let empHumBase = 0;
        for (let k = 0; k < 11; k++) empHumBase += humBuckets[hOff + k] * humScaled[k];
        const empHum = clip(empHumBase + pHumTot * (1.2 * laborSupplyDelta + 0.60 * se), 0.0, 0.86 * pHumTot);
        const erStud = clip(params.student_employment_rate + 0.40 * se, 0.15, 0.75);
        const er6574 = clip(params.elderly_65_74_employment_rate + 0.25 * se, 0.05, 0.25);

        const empNat = popNat1864[i] * erNat;
        const empWork = popWorkImm[i] * erWork;
        const empGrad = popGradImm[i] * erGrad;
        const empStud = popStudImm[i] * erStud;
        const emp6574 = pop6574[i] * er6574;
        const empTot = empNat + empWork + empGrad + empHum + empStud + emp6574;
        const nonEmp1864 = Math.max(0.0, p1864 - (empNat + empWork + empGrad + empHum + empStud));

        const realProd = clip(Number(userInputs.productivity_growth_pct) / 100.0 + shocksProd[sIdx], -0.05, 0.08);
        const nomWageG = (1.0 + params.inflation_rate) * (1.0 + realProd) - 1.0;
        cumProd[i] *= 1.0 + nomWageG;
        cumSoc[i] *= 1.0 + 0.55 * params.inflation_rate + 0.45 * nomWageG;
        cumTyel[i] *= 1.0 + 0.50 * params.inflation_rate + 0.50 * nomWageG;
        const soteG = 0.18 * params.inflation_rate + 0.82 * nomWageG + soteTrendWeight * (Number(userInputs.sote_cost_trend_adj_pct) / 100.0);
        cumSote[i] *= Math.max(0.95, 1.0 + soteG);
        cumFixed[i] *= 1.0 + 0.25 * params.inflation_rate + 0.75 * nomWageG;
        cumAsset[i] *= 1.0 + params.inflation_rate + 0.008;

        const wNatBn = (empNat * params.native_avg_wage_eur / 1e9) * cumProd[i];
        const wWorkBn = (empWork * params.work_imm_avg_wage_eur / 1e9) * cumProd[i];
        const wGradBn = (empGrad * params.grad_student_avg_wage_eur / 1e9) * cumProd[i];
        const wHumBn = (empHum * params.humanitarian_avg_wage_eur / 1e9) * cumProd[i];
        const wStudBn = (empStud * params.student_avg_wage_eur / 1e9) * cumProd[i];
        const w6574Bn = (emp6574 * params.elderly_65_74_avg_wage_eur / 1e9) * cumProd[i];
        const totWagesBn = wNatBn + wWorkBn + wGradBn + wHumBn + wStudBn + w6574Bn;

        const realWagesBn = totWagesBn / cumProd[i];
        const laborScale = Math.pow(Math.max(0.5, realWagesBn / baseWageBillBn), 0.92);
        const gdp = hist25GdpBn * laborScale * cumProd[i] * demandShock;

        const expPen = (p65p * params.pension_cost_per_65_plus_eur / 1e9) * cumTyel[i] * longevityBrake;
        const expSote = (
          (p017 * params.sote_edu_cost_0_17_eur +
           p1864 * params.sote_edu_cost_18_64_eur +
           pop6574[i] * params.sote_edu_cost_65_74_eur +
           pop75p[i] * params.sote_edu_cost_75_plus_eur) / 1e9
        ) * cumSote[i];
        const expNatSoc = ((popNat1864[i] - empNat) * params.native_social_cost_per_non_emp_eur / 1e9) * cumSoc[i] * benefitMult;
        const expWorkSoc = ((popWorkImm[i] - empWork) * params.work_imm_social_cost_per_non_emp_eur / 1e9) * cumSoc[i] * benefitMult;
        const expGradSoc = ((popGradImm[i] - empGrad) * params.work_imm_social_cost_per_non_emp_eur / 1e9) * cumSoc[i] * benefitMult;
        const recentHum = humBuckets[hOff] + humBuckets[hOff + 1] + humBuckets[hOff + 2];
        const expHumSoc = (
          ((pHumTot - empHum) * params.humanitarian_social_cost_per_non_emp_eur +
           recentHum * params.humanitarian_integration_cost_per_recent_eur) / 1e9
        ) * cumSoc[i] * benefitMult;
        const expStudSoc = ((popStudImm[i] - empStud) * params.student_social_cost_per_non_emp_eur / 1e9) * cumSoc[i] * benefitMult;
        const expImmSoc = expWorkSoc + expGradSoc + expHumSoc + expStudSoc;
        const popScaleFixed = 1.0 + 0.30 * ((pTot - Number(r2025.pop_total)) / Number(r2025.pop_total));
        const expFixed = fixed25AnchorBn * cumFixed[i] * fixedMult * Math.max(0.85, popScaleFixed);

        const prevDG = debtBn[i] / Math.max(1.0, gdp);
        const excD = Math.max(0.0, prevDG - params.risk_premium_debt_threshold);
        const excIR = Math.max(0.0, prevIntToRev[i] - params.risk_premium_interest_rev_threshold);
        const riskPrem = Math.min(0.08, 0.075 * excD + 0.18 * excIR);

        const margRate = Math.max(0.003, Number(userInputs.base_interest_rate_pct) / 100.0 + shocksRate[sIdx] + riskPrem);
        effDebtRate[i] = (1.0 - rolloverAlpha) * effDebtRate[i] + rolloverAlpha * margRate;
        const expInt = debtBn[i] * effDebtRate[i];
        const totExp = expPen + expSote + expNatSoc + expImmSoc + expFixed + expInt;

        const tuitionRevBn = ((popStudImm[i] * params.student_tuition_fee_eur) / 1e9) * Math.pow(1.0 + params.inflation_rate, t + 1);
        const taxPolRev = policyPhase * (Number(userInputs.tax_rate_change_pp) / 100.0) * gdp;
        const revWage = (totWagesBn * params.effective_wage_tax_soc_rate + expPen * params.pension_income_tax_rate + 0.55 * taxPolRev) * revCalibAnchor;
        const revClaw = params.social_clawback_rate * (expPen + expNatSoc + expImmSoc) * revCalibAnchor;
        const revCons = (totWagesBn * adjDisposableShare * params.consumption_tax_rate + params.autonomous_indirect_tax_gdp_share * gdp + 0.30 * taxPolRev) * revCalibAnchor;
        const corpPart = 0.075 * gdp;
        const assetPart = Math.max(0.0, params.corp_capital_property_gdp_share - 0.075) * hist25GdpBn * cumAsset[i];
        const revCorp = (corpPart + assetPart + 0.15 * taxPolRev) * revCalibAnchor + tuitionRevBn;

        const totRev = Math.max(1.0, revWage + revCons + revClaw + revCorp);
        const bal = totRev - totExp;
        const edpWedgeBn = (params.pension_fund_surplus_gdp_share + params.stock_flow_adj_gdp_share) * gdp;
        let debtChange = -bal + edpWedgeBn;
        if (bal > 0 && prevDG < 0.60) {
          const bufferFrac = clip((0.60 - prevDG) / 0.25, 0.0, 0.70);
          debtChange = -bal * (1.0 - bufferFrac) + edpWedgeBn;
        }
        const minGrossDebtBn = 0.35 * gdp;
        debtBn[i] = Math.max(minGrossDebtBn, debtBn[i] + debtChange);
        const dGdpPct = (100.0 * debtBn[i]) / Math.max(1.0, gdp);
        const bGdpPct = (100.0 * bal) / Math.max(1.0, gdp);
        const iRevPct = (100.0 * expInt) / Math.max(1.0, totRev);
        prevIntToRev[i] = iRevPct / 100.0;

        matRev[sIdx] = totRev;
        matExp[sIdx] = totExp;
        matBal[sIdx] = bal;
        matDebt[sIdx] = debtBn[i];
        matGdp[sIdx] = gdp;
        matDebtGdp[sIdx] = dGdpPct;
        matBalGdp[sIdx] = bGdpPct;
        matIntRev[sIdx] = iRevPct;
        matEffRate[sIdx] = 100.0 * effDebtRate[i];
        matEconDep[sIdx] = (100.0 * (pTot - empTot)) / Math.max(1.0, empTot);
        matCrisis[sIdx] = dGdpPct > 100.0 * params.crisis_debt_threshold || iRevPct > 100.0 * params.crisis_interest_rev_threshold ? 1 : 0;

        const cBase = i * nSteps + t;
        matRevComp[0 * nTotal * nSteps + cBase] = revWage;
        matRevComp[1 * nTotal * nSteps + cBase] = revCons;
        matRevComp[2 * nTotal * nSteps + cBase] = revClaw;
        matRevComp[3 * nTotal * nSteps + cBase] = revCorp;

        matExpComp[0 * nTotal * nSteps + cBase] = expPen;
        matExpComp[1 * nTotal * nSteps + cBase] = expSote;
        matExpComp[2 * nTotal * nSteps + cBase] = expNatSoc;
        matExpComp[3 * nTotal * nSteps + cBase] = expImmSoc;
        matExpComp[4 * nTotal * nSteps + cBase] = expFixed;
        matExpComp[5 * nTotal * nSteps + cBase] = expInt;

        if (i === 0) {
          detComp.pop_total[t] = pTot;
          detComp.pop_0_17[t] = p017;
          detComp.pop_18_64[t] = p1864;
          detComp.pop_65_74[t] = pop6574[0];
          detComp.pop_75_plus[t] = pop75p[0];
          detComp.employed_total[t] = empTot;
          detComp.non_employed_18_64[t] = nonEmp1864;
          detComp.demo_dependency_ratio[t] = (100.0 * (pTot - p1864)) / Math.max(1.0, p1864);
          detComp.econ_dependency_ratio[t] = (100.0 * (pTot - empTot)) / Math.max(1.0, empTot);
          detComp.eff_debt_rate_pct[t] = 100.0 * effDebtRate[0];
          detComp.marginal_rate_pct[t] = 100.0 * margRate;
          detComp.risk_premium_pct[t] = 100.0 * riskPrem;

          const ag75W = retWork6574 * 0.100;
          retWork6574 = Math.max(0.0, retWork6574 + retWork - ag75W - retWork6574 * params.mortality_rate_65_74);
          retWork75p = Math.max(0.0, retWork75p + ag75W - retWork75p * mort75p);
          const retPoolWork = retWork6574 + retWork75p;

          const ag75H = retHum6574 * 0.100;
          retHum6574 = Math.max(0.0, retHum6574 + retHumSum - ag75H - retHum6574 * params.mortality_rate_65_74);
          retHum75p = Math.max(0.0, retHum75p + ag75H - retHum75p * mort75p);
          const retPoolHum = retHum6574 + retHum75p;

          const ag75S = retStud6574 * 0.100;
          retStud6574 = Math.max(0.0, retStud6574 + retGrad - ag75S - retStud6574 * params.mortality_rate_65_74);
          retStud75p = Math.max(0.0, retStud75p + ag75S - retStud75p * mort75p);
          const retPoolStud = retStud6574 + retStud75p;

          const taxAdjMult = 1.0 + effTaxChangePp / 100.0 / 0.43;
          const corpVaShare = 0.085;
          const groups = [
            ["work", "Työperäinen maahanmuutto", popWorkImm[0], retWork6574, retWork75p, retPoolWork, wWorkBn, expWorkSoc, 0.0],
            ["humanitarian", "Humanitaarinen ja perheside", pHumTot, retHum6574, retHum75p, retPoolHum, wHumBn, expHumSoc, 0.0],
            ["students", "Kansainväliset opiskelijat", popStudImm[0] + popGradImm[0], retStud6574, retStud75p, retPoolStud, wStudBn + wGradBn, expStudSoc + expGradSoc, tuitionRevBn],
          ];
          for (const [gKey, gLabel, gPop1864, gRet6574, gRet75p, gRetTot, gWage, gSoc, gFeeRev] of groups) {
            const gPenExp = ((gRetTot * params.pension_cost_per_65_plus_eur) / 1e9) * cumTyel[0] * longevityBrake;
            const gRev = (
              gWage * (params.effective_wage_tax_soc_rate + adjDisposableShare * params.consumption_tax_rate + corpVaShare) * taxAdjMult +
              gPenExp * params.pension_income_tax_rate +
              (gSoc + gPenExp) * params.social_clawback_rate
            ) * revCalibAnchor + gFeeRev;
            const gServiceSote = (
              (gPop1864 * params.sote_edu_cost_18_64_eur +
               gRet6574 * params.sote_edu_cost_65_74_eur +
               gRet75p * params.sote_edu_cost_75_plus_eur) / 1e9
            ) * cumSote[0];
            const gFixed = (((gPop1864 + gRetTot) * fixedMarginalPerCapEur) / 1e9) * cumFixed[0] * fixedMult * Math.max(0.85, popScaleFixed);
            const gExp = gSoc + gPenExp + gServiceSote + gFixed;
            immRecords.push({
              year: year,
              group_key: gKey,
              group_name: gLabel,
              population: Math.round(gPop1864 + gRetTot),
              revenue_bn: gRev,
              social_integration_exp_bn: gSoc + gPenExp,
              service_sote_exp_bn: gServiceSote + gFixed,
              expenditure_bn: gExp,
              net_fiscal_impact_bn: gRev - gExp,
            });
          }
        }
      }
    }

    const mcStart = nSim > 0 ? 1 : 0;
    const mcCount = nSim > 0 ? nSim : 1;
    const extractCol = (mat, t) => {
      const col = new Float64Array(mcCount);
      for (let k = 0; k < mcCount; k++) col[k] = mat[(mcStart + k) * nSteps + t];
      return col;
    };
    const extractCompCol = (mat, cIdx, t) => {
      const col = new Float64Array(mcCount);
      const base = cIdx * nTotal * nSteps;
      for (let k = 0; k < mcCount; k++) col[k] = mat[base + (mcStart + k) * nSteps + t];
      return col;
    };

    const annualRows = [];
    for (const r of hist) {
      const rev = Number(r.total_revenue_bn);
      const exp = Number(r.total_expenditure_bn);
      const bal = Number(r.net_lending_bn);
      const debt = Number(r.edp_debt_bn);
      const gdp = Number(r.nominal_gdp_bn);
      const dgdp = Number(r.edp_debt_gdp_pct);
      const bgdp = Number(r.net_lending_gdp_pct);
      const irev = Number(r.interest_to_revenue_pct);
      const popW = Number(r.pop_18_64);
      const empTot = Number(r.employed_15_74_k) * 1000.0;
      const nonEmp = Math.max(0.0, popW - Number(r.employed_15_64_k) * 1000.0);
      annualRows.push({
        year: Number(r.year),
        is_historical: true,
        revenue_p05: rev, revenue_p50: rev, revenue_p95: rev,
        expenditure_p05: exp, expenditure_p50: exp, expenditure_p95: exp,
        net_lending_p05: bal, net_lending_p50: bal, net_lending_p95: bal,
        debt_p05: debt, debt_p50: debt, debt_p95: debt,
        gdp_bn: gdp,
        debt_gdp_p05: dgdp, debt_gdp_p50: dgdp, debt_gdp_p95: dgdp,
        net_lending_gdp_p05: bgdp, net_lending_gdp_p50: bgdp, net_lending_gdp_p95: bgdp,
        interest_to_rev_p05: irev, interest_to_rev_p50: irev, interest_to_rev_p95: irev,
        crisis_prob_pct: 0.0,
        is_crisis_p50: false,
        rev_wage_pension_taxes_bn: Number(r.rev_wage_pension_taxes_bn),
        rev_consumption_taxes_bn: Number(r.rev_consumption_taxes_bn),
        rev_social_clawback_bn: Number(r.rev_social_clawback_bn),
        rev_corp_capital_property_bn: Number(r.rev_corp_capital_property_bn),
        exp_pensions_bn: Number(r.exp_pensions_bn),
        exp_sote_edu_bn: Number(r.exp_sote_edu_bn),
        exp_native_social_bn: Number(r.exp_native_social_bn),
        exp_immigrant_social_bn: Number(r.exp_immigrant_social_bn),
        exp_fixed_other_bn: Number(r.exp_fixed_other_bn),
        exp_interest_bn: Number(r.exp_interest_bn),
        pop_total: Number(r.pop_total),
        pop_0_17: Number(r.pop_0_17),
        pop_18_64: popW,
        pop_65_74: Number(r.pop_65_74),
        pop_75_plus: Number(r.pop_75_plus),
        employed_total: empTot,
        non_employed_18_64: nonEmp,
        demo_dependency_ratio: Number(r.demo_dependency_ratio),
        econ_dependency_ratio: Number(r.econ_dependency_ratio),
        eff_debt_rate_pct: Math.round((10000.0 * Number(r.exp_interest_bn)) / Math.max(1.0, debt)) / 100.0,
        marginal_rate_pct: Math.round((10000.0 * Number(r.exp_interest_bn)) / Math.max(1.0, debt)) / 100.0,
        risk_premium_pct: 0.0,
      });
    }

    const crisisProbByYear = new Array(nSteps).fill(0);
    const detAnnual = [];
    for (let t = 0; t < nSteps; t++) {
      const rCol = extractCol(matRev, t);
      const eCol = extractCol(matExp, t);
      const bCol = extractCol(matBal, t);
      const dCol = extractCol(matDebt, t);
      const gCol = extractCol(matGdp, t);
      const dgCol = extractCol(matDebtGdp, t);
      const bgCol = extractCol(matBalGdp, t);
      const irCol = extractCol(matIntRev, t);
      const effRCol = extractCol(matEffRate, t);
      const econDepCol = extractCol(matEconDep, t);

      const rev50 = percentileLinear(rCol, 50);
      const exp50 = percentileLinear(eCol, 50);
      const dg50 = percentileLinear(dgCol, 50);
      const ir50 = percentileLinear(irCol, 50);

      let cHits = 0;
      for (let k = 0; k < mcCount; k++) {
        if (matCrisis[(mcStart + k) * nSteps + t]) cHits++;
      }
      crisisProbByYear[t] = (100.0 * cHits) / mcCount;

      const rawRevMed = [0, 1, 2, 3].map((c) => percentileLinear(extractCompCol(matRevComp, c, t), 50));
      const rawRevSum = Math.max(1e-9, rawRevMed.reduce((a, b) => a + b, 0));
      const alignedRev = rawRevMed.map((v) => v * (rev50 / rawRevSum));

      const rawExpMed = [0, 1, 2, 3, 4, 5].map((c) => percentileLinear(extractCompCol(matExpComp, c, t), 50));
      const rawExpSum = Math.max(1e-9, rawExpMed.reduce((a, b) => a + b, 0));
      const alignedExp = rawExpMed.map((v) => v * (exp50 / rawExpSum));

      const p017 = Math.round(detComp.pop_0_17[t]);
      const p1864 = Math.round(detComp.pop_18_64[t]);
      const p6574 = Math.round(detComp.pop_65_74[t]);
      const p75p = Math.round(detComp.pop_75_plus[t]);

      annualRows.push({
        year: forecastYears[t],
        is_historical: false,
        revenue_p05: percentileLinear(rCol, 5),
        revenue_p50: rev50,
        revenue_p95: percentileLinear(rCol, 95),
        expenditure_p05: percentileLinear(eCol, 5),
        expenditure_p50: exp50,
        expenditure_p95: percentileLinear(eCol, 95),
        net_lending_p05: percentileLinear(bCol, 5),
        net_lending_p50: percentileLinear(bCol, 50),
        net_lending_p95: percentileLinear(bCol, 95),
        debt_p05: percentileLinear(dCol, 5),
        debt_p50: percentileLinear(dCol, 50),
        debt_p95: percentileLinear(dCol, 95),
        gdp_bn: percentileLinear(gCol, 50),
        debt_gdp_p05: percentileLinear(dgCol, 5),
        debt_gdp_p50: dg50,
        debt_gdp_p95: percentileLinear(dgCol, 95),
        net_lending_gdp_p05: percentileLinear(bgCol, 5),
        net_lending_gdp_p50: percentileLinear(bgCol, 50),
        net_lending_gdp_p95: percentileLinear(bgCol, 95),
        interest_to_rev_p05: percentileLinear(irCol, 5),
        interest_to_rev_p50: ir50,
        interest_to_rev_p95: percentileLinear(irCol, 95),
        crisis_prob_pct: crisisProbByYear[t],
        is_crisis_p50: dg50 > 100.0 * params.crisis_debt_threshold || ir50 > 100.0 * params.crisis_interest_rev_threshold,
        rev_wage_pension_taxes_bn: alignedRev[0],
        rev_consumption_taxes_bn: alignedRev[1],
        rev_social_clawback_bn: alignedRev[2],
        rev_corp_capital_property_bn: alignedRev[3],
        exp_pensions_bn: alignedExp[0],
        exp_sote_edu_bn: alignedExp[1],
        exp_native_social_bn: alignedExp[2],
        exp_immigrant_social_bn: alignedExp[3],
        exp_fixed_other_bn: alignedExp[4],
        exp_interest_bn: alignedExp[5],
        pop_total: p017 + p1864 + p6574 + p75p,
        pop_0_17: p017,
        pop_18_64: p1864,
        pop_65_74: p6574,
        pop_75_plus: p75p,
        employed_total: detComp.employed_total[t],
        non_employed_18_64: detComp.non_employed_18_64[t],
        demo_dependency_ratio: detComp.demo_dependency_ratio[t],
        econ_dependency_ratio: percentileLinear(econDepCol, 50),
        eff_debt_rate_pct: percentileLinear(effRCol, 50),
        marginal_rate_pct: detComp.marginal_rate_pct[t],
        risk_premium_pct: detComp.risk_premium_pct[t],
      });

      detAnnual.push({
        year: forecastYears[t],
        rev: matRev[t],
        exp: matExp[t],
        bal: matBal[t],
        debt: matDebt[t],
        gdp: matGdp[t],
        debt_gdp: matDebtGdp[t],
        int_rev: matIntRev[t],
        exp_interest: matExpComp[5 * nTotal * nSteps + t],
      });
    }

    let everCrisisCount = 0;
    for (let k = 0; k < mcCount; k++) {
      let hit = false;
      for (let t = 0; t < nSteps; t++) {
        if (matCrisis[(mcStart + k) * nSteps + t]) {
          hit = true;
          break;
        }
      }
      if (hit) everCrisisCount++;
    }
    const crisisEverProbPct = (100.0 * everCrisisCount) / mcCount;
    const lastDebtGdpCol = extractCol(matDebtGdp, nSteps - 1);
    const verdict = evaluateVerdictJS(annualRows, crisisEverProbPct, crisisProbByYear, lastDebtGdpCol, forecastYears);
    const monthlyRows = buildMonthlyDataJS(annualRows, Boolean(userInputs.monthly_seasonal), cfg);

    return {
      annual: annualRows,
      monthly: monthlyRows,
      immigration: immRecords,
      verdict: verdict,
      detAnnual: detAnnual,
      elapsedMs: performance.now() - t0,
    };
  }

  root.SimEngine = {
    runSimulationJS: runSimulationJS,
    normalizedMigrationShares: normalizedMigrationShares,
    evaluateVerdictJS: evaluateVerdictJS,
    buildMonthlyDataJS: buildMonthlyDataJS,
  };
  if (typeof module !== "undefined" && module.exports) {
    module.exports = root.SimEngine;
  }
})(typeof window !== "undefined" ? window : globalThis);
</script>

<script id="sim-ui">
(function () {
  const banner = document.getElementById("no-js-banner");
  if (banner) banner.style.display = "none";

  const CFG = JSON.parse(document.getElementById("sim-config").textContent);
  const presetNames = Object.keys(CFG.presets);
  const defaultPreset = presetNames[0];

  const state = {
    isMonthly: false,
    monthlySeasonal: true,
    viewMode: "unified",
    activeTab: "tab1",
    inspectYear: 2035,
    scenario_name: defaultPreset,
  };
  const SLIDERS = [
    { key: "native_emp_change_pp", group: "1. Työmarkkinat ja talouskasvu", label: "Kantaväestön työllisyysasteen muutos", unit: " %-yks.", min: -5.0, max: 6.0, step: 0.5, dec: 1 },
    { key: "productivity_growth_pct", group: "1. Työmarkkinat ja talouskasvu", label: "Työn tuottavuuden ja reaalipalkkojen kasvu", unit: " %/v", min: -0.5, max: 3.5, step: 0.1, dec: 1 },
    { key: "annual_net_immigration", group: "2. Maahanmuutto ja demografia", label: "Vuotuinen nettomaahanmuutto yhteensä", unit: " hlö/v", min: 0, max: 70000, step: 1000, dec: 0 },
    { key: "work_imm_share_pct", group: "2. Maahanmuutto ja demografia", label: "Osuus työperäistä maahanmuuttoa", unit: " %", min: 0, max: 100, step: 1, dec: 0 },
    { key: "humanitarian_imm_share_pct", group: "2. Maahanmuutto ja demografia", label: "Osuus humanitaarista ja perheperusteista", unit: " %", min: 0, max: 100, step: 1, dec: 0 },

  function loadPreset(name) {

  function fmtNum(v, dec) {
    return Number(v).toLocaleString("fi-FI", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  }
  function fmtEur(v, isMonthly, signed) {
    const dec = isMonthly ? 0 : 2;
    const prefix = signed && v > 0 ? "+" : "";
    return prefix + fmtNum(v, dec) + (isMonthly ? " milj. €/kk" : " mrd. €/v");
  }
  function escHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function niceRange(minV, maxV, forceZero) {
    let lo = forceZero ? Math.min(0, minV) : minV;
    let hi = forceZero ? Math.max(0, maxV) : maxV;
    if (Math.abs(hi - lo) < 1e-6) { lo -= 1; hi += 1; }
    const pad = (hi - lo) * 0.06;
    if (lo < 0 || !forceZero) lo -= pad;
    hi += pad;
    const rawStep = (hi - lo) / 5;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / mag;
    const step = (norm <= 1.2 ? 1 : norm <= 2.5 ? 2 : norm <= 5.5 ? 5 : 10) * mag;
    const yMin = Math.floor(lo / step) * step;
    const yMax = Math.ceil(hi / step) * step;
    const ticks = [];
    for (let v = yMin; v <= yMax + step * 0.001; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
    return { yMin: ticks[0], yMax: ticks[ticks.length - 1], ticks };
  }

  function renderSvgChart(container, opts) {
    const W = 860;
    const H = opts.height || 360;
    const pad = { l: 64, r: 20, t: 22, b: 36 };
    const pw = W - pad.l - pad.r;
    const ph = H - pad.t - pad.b;
    const n = opts.xLabels.length;

    let allY = [];
    for (const b of opts.bands || []) allY.push(...b.low, ...b.high);
    for (const s of opts.lines || []) allY.push(...s.y);
    for (const bar of opts.bars || []) allY.push(...bar.y);
    for (const hl of opts.hLines || []) allY.push(hl.y);
    if (opts.stacked && opts.stacked.length) {
      for (let i = 0; i < n; i++) {
        let sum = 0;
        for (const st of opts.stacked) sum += st.y[i];
        allY.push(sum);
      }
      allY.push(0);
    }

    const range = niceRange(Math.min(...allY), Math.max(...allY), Boolean(opts.forceZero));
    const xAt = (i) => pad.l + (n <= 1 ? pw / 2 : (i / (n - 1)) * pw);
    const yAt = (v) => pad.t + ph - ((v - range.yMin) / (range.yMax - range.yMin)) * ph;

    let svg = '<svg viewBox="0 0 ' + W + " " + H + '">';
    for (const tk of range.ticks) {
      const yy = yAt(tk);
      svg += '<line x1="' + pad.l + '" y1="' + yy.toFixed(1) + '" x2="' + (W - pad.r) + '" y2="' + yy.toFixed(1) + '" stroke="#e2e8f0" stroke-width="1"/>';
      svg += '<text x="' + (pad.l - 8) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="#64748b">' + fmtNum(tk, Math.abs(tk) < 10 && tk % 1 !== 0 ? 1 : 0) + "</text>";
    }

    const xTickCount = Math.min(8, n);
    const stepIdx = Math.max(1, Math.round((n - 1) / Math.max(1, xTickCount - 1)));
    for (let i = 0; i < n; i += stepIdx) {
      const xx = xAt(i);
      svg += '<text x="' + xx.toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="11" fill="#64748b">' + escHtml(opts.xTicks ? opts.xTicks[i] : opts.xLabels[i]) + "</text>";
    }

    if (opts.stacked && opts.stacked.length) {
      const cumPrev = new Float64Array(n);
      for (const s of opts.stacked) {
        const cumNext = new Float64Array(n);
        for (let i = 0; i < n; i++) cumNext[i] = cumPrev[i] + s.y[i];
        let d = "M " + xAt(0).toFixed(1) + " " + yAt(cumNext[0]).toFixed(1);
        for (let i = 1; i < n; i++) d += " L " + xAt(i).toFixed(1) + " " + yAt(cumNext[i]).toFixed(1);
        for (let i = n - 1; i >= 0; i--) d += " L " + xAt(i).toFixed(1) + " " + yAt(cumPrev[i]).toFixed(1);
        d += " Z";
        svg += '<path d="' + d + '" fill="' + s.color + '" fill-opacity="0.78" stroke="' + s.color + '" stroke-width="0.8"/>';
        for (let i = 0; i < n; i++) cumPrev[i] = cumNext[i];
      }
    }

    for (const b of opts.bands || []) {
      const sIdx = b.startIdx || 0;
      let d = "M " + xAt(sIdx).toFixed(1) + " " + yAt(b.high[0]).toFixed(1);
      for (let i = 1; i < b.high.length; i++) d += " L " + xAt(sIdx + i).toFixed(1) + " " + yAt(b.high[i]).toFixed(1);
      for (let i = b.low.length - 1; i >= 0; i--) d += " L " + xAt(sIdx + i).toFixed(1) + " " + yAt(b.low[i]).toFixed(1);
      d += " Z";
      svg += '<path d="' + d + '" fill="' + b.fill + '"/>';
    }

    if (opts.bars && opts.bars.length === 1 && !opts.groupedBars) {
      const b = opts.bars[0];
      const bw = Math.max(1.4, (pw / n) * 0.68);
      const y0 = yAt(0);
      for (let i = 0; i < n; i++) {
        const val = b.y[i];
        const yv = yAt(val);
        const top = Math.min(y0, yv);
        const bh = Math.max(0.8, Math.abs(yv - y0));
        const col = val >= 0 ? "#16a34a" : "#dc2626";
        svg += '<rect x="' + (xAt(i) - bw / 2).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" fill="' + col + '" fill-opacity="0.78"/>';
      }
    }

    if (opts.groupedBars) {
      const nGroups = n;
      const groupW = pw / nGroups;
      const bw = Math.min(44, groupW * 0.28);
      const y0 = yAt(0);
      for (let i = 0; i < nGroups; i++) {
        const cx = pad.l + (i + 0.5) * groupW;
        for (let bi = 0; bi < opts.bars.length; bi++) {
          const val = opts.bars[bi].y[i];
          const yv = yAt(val);
          const bx = cx + (bi === 0 ? -bw - 3 : 3);
          const top = Math.min(y0, yv);
          const bh = Math.max(1, Math.abs(yv - y0));
          svg += '<rect x="' + bx.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" fill="' + opts.bars[bi].color + '" rx="3"/>';
        }
        if (opts.diamonds) {
          const dv = opts.diamonds[i];
          const dy = yAt(dv);
          svg += '<polygon points="' + cx + "," + (dy - 7) + " " + (cx + 7) + "," + dy + " " + cx + "," + (dy + 7) + " " + (cx - 7) + "," + dy + '" fill="#2563eb"/>';
          svg += '<text x="' + cx.toFixed(1) + '" y="' + (dy - 11).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">' + (dv >= 0 ? "+" : "") + fmtNum(dv, opts.dec || 2) + "</text>";
        }
      }
    }

    for (const ln of opts.lines || []) {
      let d = "M " + xAt(0).toFixed(1) + " " + yAt(ln.y[0]).toFixed(1);
      for (let i = 1; i < n; i++) d += " L " + xAt(i).toFixed(1) + " " + yAt(ln.y[i]).toFixed(1);
      const dash = ln.dash ? ' stroke-dasharray="' + ln.dash + '"' : "";
      svg += '<path d="' + d + '" fill="none" stroke="' + ln.color + '" stroke-width="' + (ln.width || 2.6) + '"' + dash + ' stroke-linejoin="round"/>';
    }

    for (const hl of opts.hLines || []) {
      const yy = yAt(hl.y);
      const dash = hl.dash ? ' stroke-dasharray="' + hl.dash + '"' : "";
      svg += '<line x1="' + pad.l + '" y1="' + yy.toFixed(1) + '" x2="' + (W - pad.r) + '" y2="' + yy.toFixed(1) + '" stroke="' + hl.color + '" stroke-width="1.5"' + dash + "/>";
      if (hl.label) {
        svg += '<text x="' + (W - pad.r - 4) + '" y="' + (yy - 4).toFixed(1) + '" text-anchor="end" font-size="10.5" font-weight="600" fill="' + hl.color + '">' + escHtml(hl.label) + "</text>";
      }
    }

    if (opts.dividerIdx !== undefined && opts.dividerIdx !== null) {
      const xd = (xAt(opts.dividerIdx) + xAt(Math.min(n - 1, opts.dividerIdx + 1))) / 2;
      svg += '<line x1="' + xd.toFixed(1) + '" y1="' + pad.t + '" x2="' + xd.toFixed(1) + '" y2="' + (H - pad.b) + '" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4"/>';
      svg += '<text x="' + xd.toFixed(1) + '" y="' + (pad.t + 12) + '" text-anchor="middle" font-size="10.5" fill="#475569">Historia | Ennuste</text>';
    }

    svg += '<line class="crosshair" x1="0" y1="' + pad.t + '" x2="0" y2="' + (H - pad.b) + '" stroke="#0f172a" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>';
    svg += '<rect class="hit-area" x="' + pad.l + '" y="' + pad.t + '" width="' + pw + '" height="' + ph + '" fill="transparent"/>';
    svg += "</svg>";

    const legendHtml = (opts.legend || []).map((lg) =>
      '<span class="legend-item"><span class="swatch" style="background:' + lg.color + '"></span>' + escHtml(lg.label) + "</span>"
    ).join("");

    container.innerHTML =
      '<div class="chart-card">' +
        '<div class="chart-header">' +
          '<div class="chart-title">' + escHtml(opts.title) + '</div>' +
          '<div class="chart-readout">Kosketa tai vie osoitin kuvaajaan</div>' +
        '</div>' +
        '<div class="svg-wrap">' + svg + "</div>" +
        (legendHtml ? '<div class="legend">' + legendHtml + "</div>" : "") +
      "</div>";

    const svgEl = container.querySelector("svg");
    const hit = container.querySelector(".hit-area");
    const ch = container.querySelector(".crosshair");
    const ro = container.querySelector(".chart-readout");
    function handleMove(ev) {
      const rect = svgEl.getBoundingClientRect();
      const svgX = ((ev.clientX - rect.left) / rect.width) * W;
      let idx;
      if (opts.groupedBars) {
        idx = Math.min(n - 1, Math.max(0, Math.floor(((svgX - pad.l) / pw) * n)));
      } else {
        idx = Math.min(n - 1, Math.max(0, Math.round(((svgX - pad.l) / pw) * (n - 1))));
      }
      const cx = opts.groupedBars ? pad.l + ((idx + 0.5) * pw) / n : xAt(idx);
      ch.setAttribute("x1", cx.toFixed(1));
      ch.setAttribute("x2", cx.toFixed(1));
      ch.style.display = "block";
      ro.innerHTML = opts.formatReadout(idx);
    }
    hit.addEventListener("pointermove", handleMove);
    hit.addEventListener("pointerdown", handleMove);
    hit.addEventListener("pointerleave", () => { ch.style.display = "none"; });
  }

    for (const s of SLIDERS) {
      const el = document.getElementById("rng_" + s.key);
      el.oninput = (e) => {
        state[s.key] = Number(e.target.value);
        document.getElementById("val_" + s.key).textContent = fmtNum(state[s.key], s.dec) + s.unit;

  function updateMigCaption() {
    const el = document.getElementById("mig-norm");
    if (!el) return;
    const [w, h, s] = window.SimEngine.normalizedMigrationShares(state);
    const tot = Number(state.annual_net_immigration);
    el.textContent =
      "Normalisoitu jako: Työperäinen " + Math.round(w * 100) + " % (" + Math.round(tot * w).toLocaleString("fi-FI") + ") • " +
      "Hum./perhe " + Math.round(h * 100) + " % (" + Math.round(tot * h).toLocaleString("fi-FI") + ") • " +
      "Opiskelijat " + Math.round(s * 100) + " % (" + Math.round(tot * s).toLocaleString("fi-FI") + ")";
  }

  let latestResult = null;

    const inputs = Object.assign({ monthly_seasonal: state.monthlySeasonal }, state);

    document.getElementById("kpi-heading").textContent = "Keskeiset tunnusluvut (" + unit + "): 2025 vs. 2035 vs. 2050";
    const byY = (yr) => res.annual.find((r) => r.year === yr);
    const kpiHtml = [[2025, "2025 (Toteutunut)"], [2035, "2035 (Ennuste, mediaani)"], [2050, "2050 (Ennuste, mediaani)"]].map(([yr, lbl]) => {
      const r = byY(yr);
      const bVal = r.net_lending_p50 * scale;
      const bCls = r.net_lending_gdp_p50 >= 0 ? "pos" : "neg";

        '<div><div class="kpi-label">Menot</div><div class="kpi-num">' + fmtEur(r.expenditure_p50 * scale, isM, false) + "</div></div>" +
        '<div><div class="kpi-label">Rahoitusjäämä</div><div class="kpi-num">' + fmtEur(bVal, isM, true) + '</div><div class="kpi-delta ' + bCls + '">' + (r.net_lending_gdp_p50 >= 0 ? "+" : "") + fmtNum(r.net_lending_gdp_p50, 1) + " % BKT</div></div>" +
        '<div><div class="kpi-label">Julkinen velka</div><div class="kpi-num">' + fmtNum(r.debt_p50, 1) + ' mrd. €</div><div class="kpi-delta ' + dCls + '">' + fmtNum(r.debt_gdp_p50, 1) + " % BKT</div></div>" +
        '</div><div class="caption" style="margin-top:8px">Huoltosuhde: dem. <b>' + fmtNum(r.demo_dependency_ratio, 1) + "</b> | tal. <b>" + fmtNum(r.econ_dependency_ratio, 1) + "</b></div></div>";
    }).join("");
    document.getElementById("kpi-grid").innerHTML = kpiHtml;

    renderTabs(res);
  }

  function renderTabs(res) {
    const isM = state.isMonthly;
    const dec = isM ? 0 : 2;
    const unit = isM ? "milj. €/kk" : "mrd. €/v";
    const src = isM ? res.monthly : res.annual;
    const xLabels = src.map((r) => (isM ? r.ym : String(r.year)));
    const xTicks = src.map((r) => (isM ? (r.month === 1 ? String(r.year) : "") : String(r.year)));
    const fanStart = isM ? src.findIndex((r) => r.ym === "2025-12") : src.findIndex((r) => r.year === 2025);
    const divIdx = fanStart;
    const fanSlice = src.slice(fanStart);

    const rev50 = src.map((r) => (isM ? r.revenue_p50_meur : r.revenue_p50));
    const rev05 = fanSlice.map((r) => (isM ? r.revenue_p05_meur : r.revenue_p05));
    const rev95 = fanSlice.map((r) => (isM ? r.revenue_p95_meur : r.revenue_p95));
    const exp50 = src.map((r) => (isM ? r.expenditure_p50_meur : r.expenditure_p50));
    const exp05 = fanSlice.map((r) => (isM ? r.expenditure_p05_meur : r.expenditure_p05));
    const exp95 = fanSlice.map((r) => (isM ? r.expenditure_p95_meur : r.expenditure_p95));
    const bal50 = src.map((r) => (isM ? r.net_lending_p50_meur : r.net_lending_p50));
    const bal05 = fanSlice.map((r) => (isM ? r.net_lending_p05_meur : r.net_lending_p05));
    const bal95 = fanSlice.map((r) => (isM ? r.net_lending_p95_meur : r.net_lending_p95));

    // TAB 1
    const t1 = document.getElementById("tab1");
    t1.innerHTML =
      '<div class="radio-row" style="max-width:520px;margin-bottom:10px">' +
        '<div class="radio-pill ' + (state.viewMode === "unified" ? "active" : "") + '" id="vm-uni">Yhtenäinen pääkuvaaja</div>' +
        '<div class="radio-pill ' + (state.viewMode === "split" ? "active" : "") + '" id="vm-spl">Jaettu näkymä</div>' +
      '</div><div id="t1-main"></div><div id="t1-split"></div><div id="t1-bal"></div>';
    document.getElementById("vm-uni").onclick = () => { state.viewMode = "unified"; renderTabs(res); };
    document.getElementById("vm-spl").onclick = () => { state.viewMode = "split"; renderTabs(res); };

    if (state.viewMode === "unified") {
      renderSvgChart(document.getElementById("t1-main"), {
        title: "Julkisen talouden tulot, menot ja rahoitusjäämä (" + unit + ")",
        height: 410,
        xLabels, xTicks, dividerIdx: divIdx, forceZero: true,
